# Local development stack. The ledger/ledger credentials and sslmode=disable
# are for this stack only: every port is published on 127.0.0.1, and the app
# runs with APP_ENV=development, the only mode that accepts default
# credentials. Do not deploy this file.
name: go-ledger-service

services:
  app:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      AMQP_URL: amqp://ledger:ledger@rabbitmq:5672/
      AMQP_QUEUE: ledger.events.audit
      LOG_LEVEL: info
      # Digests of the local API keys, read from .env (run `make dev-env`).
      AUTH_API_KEYS: ${AUTH_API_KEYS:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ledger
      RABBITMQ_DEFAULT_PASS: ledger
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
